name: Publish library
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']      # documentation-only changes change nothing that is published
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
# A new push to a pull request cancels its older, now pointless run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  # Fast, browser-free gates (seconds).
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate catalog
        run: python tools/validate_site.py
      - name: Validate fonts
        run: python tools/validate_fonts.py
      - name: Validate i18n
        run: python tools/validate_i18n.py
      - name: Verify catalog interactions
        run: |
          for f in site/*.js; do node --check "$f"; done
          node tools/check_app.cjs
          node tools/check_app.cjs --missing-art
      - name: Shared GL layer (no direct context listeners, one watch per renderer)
        run: python tools/gl_audit.py
  # Browser gates run in parallel (each on software GL); the slowest slice now sets the time instead of the sum.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UI audit (overflow, console errors, contrast)
            cmd: python tools/ui_audit.py
          - name: Text fit, reduced motion, leak check
            cmd: |
              python tools/text_fit_audit.py
              python tools/reduced_audit.py
              python tools/leak_audit.py --rounds 8
          - name: Features (camera, governor, dive, book, medal, dome, context loss)
            cmd: python tools/feature_audit.py --only main
          - name: Broken GPU fallback (B9)
            cmd: python tools/feature_audit.py --only b9
          - name: Quality tiers (B10)
            cmd: python tools/feature_audit.py --only b10
          - name: GPU timing, ?perf, warm-up (B11)
            cmd: python tools/feature_audit.py --only b11
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Playwright
        run: python -m pip install --quiet playwright
      - name: Playwright version
        id: pw
        run: |
          echo "v=$(python -m pip show playwright | sed -n 's/^Version: //p')" >> "$GITHUB_OUTPUT"
      - name: Cache the browser download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - name: Install browser and system libraries
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}
  # R3 visual regression gate: four configurations in parallel (viewport x theme), each captured twice (stability) and compared with tools/golden/ (committed, generated on CI by update-goldens.yml).
  # A pixel regression blocks the deploy. After an intended visual change: run 'Update visual goldens' (workflow_dispatch), review the PR from goldens/update, merge it.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {config: '1440x900:dark', slug: '1440-dark'}
          - {config: '1440x900:light', slug: '1440-light'}
          - {config: '1024x768:dark', slug: '1024-dark'}
          - {config: '1024x768:light', slug: '1024-light'}
    name: visual ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Playwright and image libraries
        run: python -m pip install --quiet playwright pillow numpy
      - name: Playwright version
        id: pw
        run: |
          echo "v=$(python -m pip show playwright | sed -n 's/^Version: //p')" >> "$GITHUB_OUTPUT"
      - name: Cache the browser download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - name: Install browser and system libraries
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - name: Visual regression gate (R3)
        run: python tools/visual_audit.py --config ${{ matrix.config }}
      - name: Visual output (candidates and differences)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ matrix.slug }}
          path: |
            tools/golden/_out/candidates
            tools/golden/_diff
          if-no-files-found: ignore
  deploy:
    needs: [static, browser, visual]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # Pages rejects a deployment while a previous one is still finishing (HTTP 400 "in progress deployment"); wait and retry.
      - name: Wait before retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 150
      - name: Deploy (retry 1)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry 2
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 240
      - name: Deploy (retry 2)
        id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
