name: Publish library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate catalog
        run: python tools/validate_site.py
      - name: Validate fonts
        run: python tools/validate_fonts.py
      - name: Validate i18n
        run: python tools/validate_i18n.py
      - name: Verify catalog interactions
        run: |
          node --check site/app.js
          node --check site/sw.js
          node --check site/i18n.js
          node --check site/i18n-data.js
          node --check site/visuals.js
          node --check site/effects.js
          node --check site/record.js
          node --check site/palette.js
          node --check site/discovery.js
          node --check site/nobel3d.js
          node --check site/stage.js
          node --check site/hero3d.js
          node --check site/facets.js
          node --check site/progress.js
          node --check site/constellation3d.js
          node tools/check_app.cjs
          node tools/check_app.cjs --missing-art
      - name: UI audit (overflow, console errors, contrast)
        timeout-minutes: 12
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python tools/ui_audit.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # Pages rejects a deployment while a previous one is still finishing (HTTP 400 "in progress deployment"); wait and retry.
      - name: Wait before retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 150
      - name: Deploy (retry 1)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry 2
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 240
      - name: Deploy (retry 2)
        id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
